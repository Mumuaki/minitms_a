# Obvious automated scrapers and mass scanners.
# NOTE: User-Agent matching is trivially spoofed - this is noise reduction, NOT a
# security control. Real protection against scanners needs a network allowlist.
map $http_user_agent $bad_bot {
    default 0;
    ~*(AhrefsBot|SemrushBot|MJ12bot|DotBot|PetalBot|Bytespider|MegaIndex|BLEXBot|DataForSeoBot|SeznamBot|ScreamingFrog|SiteAuditBot|serpstatbot) 1;
    ~*(LEAKIX|zgrab|masscan|zmap|nmap|sqlmap|nikto|CensysInspect|Shodan|InternetMeasurement|Nuclei|WPScan|DirBuster|gobuster) 1;
}
