# HTTP: serve the ACME challenge, redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name minitms.is-logix.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS, proxy to the frontend container on loopback
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name minitms.is-logix.com;

    ssl_certificate     /etc/letsencrypt/live/minitms.is-logix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minitms.is-logix.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    # Search engines: the authoritative no-index signal. robots.txt alone does not
    # stop indexing of pages linked from elsewhere; this header does.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, notranslate" always;

    # Courtesy stop sign for well-behaved crawlers.
    location = /robots.txt {
        default_type text/plain;
        alias /var/www/robots.txt;
    }

    # Obvious scrapers/scanners (see /etc/nginx/conf.d/bot-deterrence.conf).
    if ($bad_bot) { return 403; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
