# HTTP: serve the ACME challenge, redirect everything else to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name minitms.is-logix.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS, gate the UI behind basic auth, proxy to the container
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name minitms.is-logix.com;

    ssl_certificate     /etc/letsencrypt/live/minitms.is-logix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minitms.is-logix.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, notranslate" always;

    # Left readable on purpose: crawlers should be able to read the stop sign.
    location = /robots.txt {
        default_type text/plain;
        alias /var/www/robots.txt;
    }

    if ($bad_bot) { return 403; }

    # API: authenticated by the application itself with its own JWT. This MUST NOT
    # sit behind basic auth - the SPA replaces the Authorization header with
    # "Bearer <token>" on these calls, so demanding Basic here would reject every
    # authenticated request the frontend makes.
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # The SPA and its assets: password required. This is what keeps bots out of
    # the application itself.
    location / {
        auth_basic "MiniTMS";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
